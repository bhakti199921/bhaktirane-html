<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="app/images/logo.png" type="image/x-icon">
    <title>Login Page</title>
    <link rel="stylesheet" href="app/css/style.css">
</head>

<body>
    <section class="login">
        <!-- <img src="app/images/bluish-plant-leaves-textured .png" alt="bluish-plant-leaves-textured"
            class="login__plant-leaves"> -->
        <div class="login-container">
            <div class="login__details">
                <div class="login__logoname-wrapper">
                    <h2 class="login__logoname">Deloitte</h2>
                    <span class="login__dot"></span>
                </div>
                <div>
                    <form class="login__form">
                        <h2 class="login__title">Login into the account</h2>
                        <div class="login__username-wrapper">
                            <input type="text" required class="login__input">
                            <label class="login__text">Username</label>
                        </div>
                        <div class="login__password-wrapper">
                            <input type="password" required class="login__input">
                            <label class="login__pswd">Password</label>
                            <span class="login__questionmark">?</span>
                        </div>
                        <div class="login__check-button-wrapper">
                            <input type="checkbox" class="login__checkbox">
                            <label class="login__remember">Remember me</label>
                            <button class="btn btn--submit">Login</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </section>
</body>

</html>
